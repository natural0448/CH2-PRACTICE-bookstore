version: 1
domains:
  - domain_id: ID_20
    description: 영문자로 시작하는 20자 이내 식별자
    logical_type: identifier
    python_type: str
    database_type: VARCHAR
    length: 20
    nullable: false
    format: '^[A-Z][A-Z0-9-]{0,19}$'
    allowed_values: []
    examples:
      - M0001
      - B001
      - O1001
  - domain_id: NAME_100
    description: 앞뒤 공백을 제거한 1자 이상 100자 이하 이름
    logical_type: name
    python_type: str
    database_type: VARCHAR
    length: 100
    nullable: false
    format: '^.{1,100}$'
    allowed_values: []
    examples:
      - 김민수
      - 데이터
  - domain_id: NAME_200
    description: 앞뒤 공백을 제거한 1자 이상 200자 이하 이름
    logical_type: name
    python_type: str
    database_type: VARCHAR
    length: 200
    nullable: false
    format: '^.{1,200}$'
    allowed_values: []
    examples:
      - 데이터 모델링 입문
  - domain_id: CODE_20
    description: 영문자로 시작하는 20자 이내 분류 코드
    logical_type: code
    python_type: str
    database_type: VARCHAR
    length: 20
    nullable: false
    format: '^[A-Z][A-Z0-9_\-]{0,19}$'
    allowed_values: []
    examples:
      - C01
  - domain_id: DATETIME_ISO_SECOND
    description: 초 단위까지 표현한 ISO 8601 날짜와 시각
    logical_type: datetime
    python_type: datetime
    database_type: DATETIME
    nullable: false
    format: '%Y-%m-%dT%H:%M:%S'
    allowed_values: []
    examples:
      - '2026-08-10T09:15:00'
  - domain_id: ORDER_STATUS_CODE
    description: 주문 처리의 현재 단계를 나타내는 코드
    logical_type: code
    python_type: str
    database_type: VARCHAR
    length: 20
    nullable: false
    format: '^[A-Z_]+$'
    allowed_values:
      - PAID
      - SHIPPING
      - DONE
      - CANCELLED
    examples:
      - PAID
      - SHIPPING
  - domain_id: POSITIVE_INTEGER_3
    description: 1부터 999까지의 양의 정수
    logical_type: quantity
    python_type: int
    database_type: INTEGER
    nullable: false
    minimum: 1
    maximum: 999
    allowed_values: []
    examples:
      - 1
      - 2
  - domain_id: MONEY_12_2
    description: 0 이상이며 소수 둘째 자리까지 표현하는 금액
    logical_type: money
    python_type: Decimal
    database_type: DECIMAL
    precision: 12
    scale: 2
    nullable: false
    minimum: 0.00
    allowed_values: []
    examples:
      - 18000.00
      - 22000.00