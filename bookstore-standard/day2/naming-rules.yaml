version: 1
language:
  logical_name: ko
  physical_name: en
rules:
  physical_case: lower_snake_case
  physical_name_pattern: '^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$'
  entity_noun_number: singular
  word_separator: '_'
  identifier_suffix: '_id'
  code_suffix: '_code'
  datetime_suffix: '_datetime'
  approved_abbreviations:
    - id
  prohibited_legacy_abbreviations:
    - mbr
    - nm
    - bk
    - ctg
    - ord
    - dtm
    - st
    - qty
    - amt
examples:
  valid:
    - member_id
    - order_status_code
    - order_datetime
  invalid:
    - mbr_no
    - orderStatus
    - books_id